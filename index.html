<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit enterprise travel platform</title>

    <!--
      The theme is applied before first paint so a dark-mode user never sees a white
      flash. It has to be inline and synchronous: a deferred script runs after the
      browser has already painted.
    -->
    <script>
      try {
        var stored = localStorage.getItem('orbit-theme')

        // Light by default, and it no longer follows the system preference. A travel
        // manager sees this console, the public site and every Orbit email in the same
        // afternoon, and a phone set to dark mode should not make one of the three look
        // like a different company. Anyone who wants dark still has the toggle, and the
        // choice is remembered.
        document.documentElement.dataset.theme = stored || 'light'
      } catch (_) {
        /* Private mode, or storage disabled. The light default already applies. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
